<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>EpicWorlds50 Viewer</title>
<link rel="icon" href="Assets/branding/jaking_company_logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0d1018; --panel:rgba(13,16,24,.72); --line:rgba(255,255,255,.12); --ink:#f4f1ea; --dim:#9aa3b8; --gold:#f6c453; --amber:#e07a2e; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:Outfit,system-ui,sans-serif; overflow:hidden; }
  canvas { display:block; touch-action:none; }
  .panel { position:fixed; background:var(--panel); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid var(--line); border-radius:14px; }
  #info { top:14px; left:14px; max-width:min(420px, calc(100vw - 28px)); padding:14px 16px; }
  #info .brand { display:flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.24em; color:var(--gold); font-weight:600; text-transform:uppercase; }
  #info .brand a { color:inherit; text-decoration:none; }
  #info h1 { margin:6px 0 2px; font-size:22px; font-weight:800; line-height:1.15; }
  #info .lm { color:var(--dim); font-size:13px; }
  #info .lm b { color:var(--ink); }
  #lore { margin:10px 0 0; font-size:13px; line-height:1.5; color:#cfd5e2; }
  #info.collapsed #lore { display:none; }
  #toggleLore { background:none; border:0; color:var(--gold); font:inherit; font-size:12px; padding:6px 0 0; cursor:pointer; }
  #bar { left:50%; bottom:14px; transform:translateX(-50%); display:flex; gap:6px; padding:6px; max-width:calc(100vw - 28px); overflow-x:auto; }
  #bar button, #bar select, #bar a { appearance:none; background:transparent; border:1px solid transparent; color:var(--ink); font:inherit; font-size:14px;
     padding:9px 13px; border-radius:10px; cursor:pointer; white-space:nowrap; text-decoration:none; display:inline-flex; align-items:center; }
  #bar button:hover, #bar a:hover { background:rgba(255,255,255,.08); }
  #bar button.on { background:linear-gradient(135deg,var(--gold),var(--amber)); color:#1a1205; font-weight:600; }
  #bar select { border-color:var(--line); background:rgba(0,0,0,.25); }
  #bar select option { background:#111; }
  #help { right:14px; top:14px; padding:10px 12px; font-size:12px; color:var(--dim); line-height:1.6; }
  #loading { position:fixed; inset:0; display:grid; place-items:center; background:radial-gradient(circle at 50% 40%,#1b2133,#0b0d14); z-index:5; transition:opacity .6s; }
  #loading .box { text-align:center; width:min(360px,80vw); }
  #loading img { width:min(320px,70vw); }
  #loading .track { height:6px; background:rgba(255,255,255,.1); border-radius:6px; margin-top:22px; overflow:hidden; }
  #loading .fill { height:100%; width:0; background:linear-gradient(90deg,var(--gold),var(--amber)); transition:width .2s; }
  #loading .msg { margin-top:10px; color:var(--dim); font-size:13px; }
  #err { color:#ff8a7a; }
  @media (max-width:700px){ #help{display:none} #info h1{font-size:18px} #info{padding:10px 12px} }
</style>
</head>
<body>
<div id="loading"><div class="box"><img src="Assets/branding/jaking_company_logo.svg" alt="Jaking Company"><div class="track"><div class="fill" id="fill"></div></div><div class="msg" id="msg">Loading world…</div></div></div>
<div id="info" class="panel">
  <div class="brand"><a href="./">EpicWorlds50</a> · Jaking Company</div>
  <h1 id="title">…</h1>
  <div class="lm" id="lm"></div>
  <p id="lore"></p>
  <button id="toggleLore">Hide story</button>
</div>
<div id="help" class="panel">Drag to orbit · Right-drag or two fingers to pan · Scroll or pinch to zoom<br>Keys: T tour · H hero · A aerial · F free</div>
<div id="bar" class="panel">
  <button id="bTour" class="on">▶ Cinematic tour</button>
  <button id="bHero">Hero view</button>
  <button id="bAerial">Aerial</button>
  <button id="bFree">Free look</button>
  <select id="worldSel" aria-label="Choose world"></select>
  <a href="./">All worlds</a>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const WORLDS = [
  ['RW01_GizaPlateau', 'Giza Plateau'], ['RW02_MontSaintMichel', 'Mont-Saint-Michel'],
  ['FW01_ChocolateLand', 'Chocolate Land'], ['FW02_CrystalEmpire', 'Crystal Empire'], ['FW03_SkyKingdom', 'Sky Kingdom'] ];
const params = new URLSearchParams(location.search);
const WID = WORLDS.some(w => w[0] === params.get('w')) ? params.get('w') : WORLDS[0][0];
const BASE = `web/worlds/${WID}/`;
const $ = id => document.getElementById(id);
const sel = $('worldSel');
for (const [id, name] of WORLDS) { const o = document.createElement('option'); o.value = id; o.textContent = name; o.selected = id === WID; sel.appendChild(o); }
sel.onchange = () => { location.search = '?w=' + sel.value; };
$('toggleLore').onclick = () => { $('info').classList.toggle('collapsed'); $('toggleLore').textContent = $('info').classList.contains('collapsed') ? 'Show story' : 'Hide story'; };
const setProgress = (p, m) => { $('fill').style.width = Math.round(p * 100) + '%'; if (m) $('msg').textContent = m; };
const fail = e => { console.error(e); $('msg').innerHTML = '<span id="err">Could not load this world. ' + (e.message || e) + '</span>'; };
const sanitize = n => n.replace(/\s/g, '_').replace(/[\[\]\.:\/]/g, '');
const mobile = matchMedia('(max-width: 700px), (pointer: coarse)').matches;

// ---------------------------------------------------------------- renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: !mobile, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, mobile ? 1.25 : 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = !mobile;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 1, 40000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.minDistance = 15; controls.maxDistance = 9000; controls.maxPolarAngle = Math.PI * 0.495;
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
const uTime = { value: 0 };

// value-noise canvas for clouds
function cloudTexture(coverage) {
  const S = 512, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), img = g.createImageData(S, S);
  const R = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
  const vn = (x, y, p) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const h = (a, b) => R(((a % p) + p) % p * 57 + (((b % p) + p) % p) * 131);
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return (h(xi, yi) * (1 - u) + h(xi + 1, yi) * u) * (1 - v) + (h(xi, yi + 1) * (1 - u) + h(xi + 1, yi + 1) * u) * v; };
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    let f = 0, a = .5, fr = 4;
    for (let o = 0; o < 5; o++) { f += a * vn(x / S * fr, y / S * fr, fr); a *= .5; fr *= 2; }
    const t = Math.min(1, Math.max(0, (f - (1 - coverage)) / 0.22));
    const i = (y * S + x) * 4; img.data[i] = img.data[i + 1] = img.data[i + 2] = 255; img.data[i + 3] = t * 235;
  }
  g.putImageData(img, 0, 0);
  const tx = new THREE.CanvasTexture(c); tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.colorSpace = THREE.SRGBColorSpace;
  return tx;
}

function windify(mat) {
  mat = mat.clone();
  mat.onBeforeCompile = sh => {
    sh.uniforms.uTime = uTime;
    sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      #ifdef USE_INSTANCING
        vec3 ip = vec3(instanceMatrix[3]);
        float hh = max(transformed.y, 0.0);
        transformed.x += sin(uTime * 1.7 + ip.x * 0.045) * hh * 0.035;
        transformed.z += cos(uTime * 1.3 + ip.z * 0.045) * hh * 0.035;
      #endif`);
  };
  return mat;
}

function waterify(mat) {
  mat = mat.clone(); mat.roughness = Math.min(mat.roughness, 0.12); mat.metalness = 0.15; mat.envMapIntensity = 1.2;
  mat.onBeforeCompile = sh => {
    sh.uniforms.uTime = uTime;
    sh.vertexShader = 'varying vec3 vWp;\n' + sh.vertexShader.replace('#include <project_vertex>', '#include <project_vertex>\n vWp = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = 'uniform float uTime; varying vec3 vWp;\n' + sh.fragmentShader.replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
      float w1 = sin(vWp.x * 0.06 + uTime * 1.6) * cos(vWp.z * 0.045 + uTime * 1.1);
      float w2 = sin((vWp.x + vWp.z) * 0.13 - uTime * 2.3);
      normal = normalize(normal + vec3(w1 * 0.12 + w2 * 0.05, 0.0, w2 * 0.1 - w1 * 0.05));`);
  };
  return mat;
}

const WATER = /^(Ocean|Nile|ChocolateRiver|ChocolateFall|StarlightRiver|SkyWaterfall|Crater_CaramelPool)/;
const STILL = /(rock|crystal|shard|Mote)/i;

async function main() {
  setProgress(0.05, 'Reading world data…');
  const meta = await (await fetch(BASE + 'meta.json')).json();
  document.title = `${meta.title.split(' - ')[0]} · EpicWorlds50`;
  $('title').textContent = meta.title;
  const lm = meta.mega_landmark || {};
  $('lm').innerHTML = `Mega Landmark: <b>${lm.name || ''}</b> · ${Math.round(lm.height_m || 0)} m`;
  $('lore').textContent = meta.lore || '';

  // sky dome + fog + lights
  const sky = meta.sky || { horizon: '#c9dcef', zenith: '#3b6fb5' };
  const skyMat = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { h: { value: new THREE.Color(sky.horizon) }, z: { value: new THREE.Color(sky.zenith) } },
    vertexShader: 'varying vec3 p; void main(){ p = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'uniform vec3 h;\nuniform vec3 z;\nvarying vec3 p;\nvoid main(){\n float t = clamp(p.y * 1.4, 0.0, 1.0);\n gl_FragColor = vec4(mix(h, z, pow(t, 0.8)), 1.0);\n#include <tonemapping_fragment>\n#include <colorspace_fragment>\n}' });
  const dome = new THREE.Mesh(new THREE.SphereGeometry(30000, 32, 16), skyMat);
  scene.add(dome);
  const fogC = new THREE.Color((meta.fog && meta.fog.color) || sky.horizon);
  const fd = Math.min(0.00022, Math.max(0.00007, ((meta.fog && meta.fog.density) || 0.0001) * 1.4));
  scene.fog = new THREE.FogExp2(fogC, fd);
  const pm = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene(); envScene.add(new THREE.Mesh(new THREE.SphereGeometry(100, 32, 16), skyMat.clone()));
  scene.environment = pm.fromScene(envScene, 0.04).texture;
  const sunD = new THREE.Vector3(...((meta.sun && meta.sun.dir) || [0.4, 0.8, 0.3])).normalize();
  const sunL = new THREE.DirectionalLight(new THREE.Color((meta.sun && meta.sun.color) || '#ffffff'), Math.min(4.5, ((meta.sun && meta.sun.power) || 4) * 0.75));
  const focus = new THREE.Vector3(...(meta.focus || [0, 0, 0]));
  sunL.position.copy(focus).addScaledVector(sunD, 3000); sunL.target.position.copy(focus);
  sunL.castShadow = !mobile;
  Object.assign(sunL.shadow.camera, { left: -1600, right: 1600, top: 1600, bottom: -1600, near: 100, far: 7000 });
  sunL.shadow.mapSize.set(2048, 2048); sunL.shadow.bias = -0.0004; sunL.shadow.normalBias = 1.5;
  scene.add(sunL, sunL.target, new THREE.HemisphereLight(new THREE.Color(sky.zenith), new THREE.Color('#6b5a45'), 0.9));

  // world geometry
  setProgress(0.15, 'Streaming terrain and architecture…');
  const draco = new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/gltf/');
  const loader = new GLTFLoader().setDRACOLoader(draco);
  const [gltf, binBuf] = await Promise.all([
    new Promise((res, rej) => loader.load(BASE + 'world.glb', res, e => e.total && setProgress(0.15 + 0.55 * e.loaded / e.total), rej)),
    fetch(BASE + 'instances.bin').then(r => r.arrayBuffer()) ]);
  setProgress(0.75, 'Planting vegetation…');
  const world = gltf.scene;
  // vegetation: GPU instancing from Blender's Geometry Nodes scatter
  const floats = new Float32Array(binBuf);
  const sources = [];
  for (const [name, [off, count]] of Object.entries(meta.instances || {})) {
    const node = world.getObjectByName(sanitize(name));
    if (!node || !count) continue;
    sources.push(node);
    const meshes = []; node.traverse(o => o.isMesh && meshes.push(o));
    const m = new THREE.Matrix4();
    for (const mesh of meshes) {
      const local = mesh === node ? null : mesh.matrix;
      const mat = STILL.test(name) ? mesh.material : windify(mesh.material);
      const im = new THREE.InstancedMesh(mesh.geometry, mat, count);
      for (let i = 0; i < count; i++) { m.fromArray(floats, off + i * 16); if (local) m.multiply(local); im.setMatrixAt(i, m); }
      im.instanceMatrix.needsUpdate = true; im.receiveShadow = true; im.castShadow = !mobile && count < 4000;
      im.computeBoundingSphere(); im.frustumCulled = false;
      scene.add(im);
    }
  }
  for (const s of sources) s.removeFromParent();
  world.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = o.receiveShadow = true;
    if (WATER.test(o.name) || WATER.test(o.parent && o.parent.name || '')) { o.material = waterify(o.material); o.castShadow = false; }
    if (/Terrain|SunkenWorldFloor/.test(o.name)) { o.material.vertexColors = !!o.geometry.attributes.color; o.castShadow = false; }
    if (o.material.emissiveIntensity > 0 && o.material.emissive && o.material.emissive.getHex() !== 0) o.material.toneMapped = true;
  });
  scene.add(world);

  // clouds, particles, glow lights
  const clouds = [];
  for (const c of meta.clouds || []) {
    const tx = cloudTexture(Math.min(0.75, Math.max(0.25, c.coverage)));
    tx.repeat.set(2.5, 2.5);
    const mat = new THREE.MeshBasicMaterial({ map: tx, color: new THREE.Color(c.color), transparent: true, depthWrite: false, side: THREE.DoubleSide, fog: true, opacity: 0.92 });
    const pl = new THREE.Mesh(new THREE.PlaneGeometry(c.size * 1.6, c.size * 1.6), mat);
    pl.rotation.x = -Math.PI / 2; pl.position.set(focus.x, c.y, focus.z); pl.renderOrder = 2;
    scene.add(pl); clouds.push(tx);
  }
  const motes = [];
  for (const p of meta.particles || []) {
    const n = mobile ? Math.min(800, p.count) : p.count, pos = new Float32Array(n * 3), ph = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      pos[i * 3] = p.center[0] + (Math.random() - .5) * p.size; pos[i * 3 + 1] = p.center[1] + Math.random() * Math.max(60, p.size * 0.12);
      pos[i * 3 + 2] = p.center[2] + (Math.random() - .5) * p.size; ph[i] = Math.random() * 6.28;
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const pts = new THREE.Points(g, new THREE.PointsMaterial({ color: new THREE.Color(p.color), size: 1.6, transparent: true, opacity: .85, blending: THREE.AdditiveBlending, depthWrite: false }));
    scene.add(pts); motes.push({ pts, base: pos.slice(), ph });
  }
  const glows = [];
  for (const gl of (meta.glows || []).slice(0, 6)) {
    const L = new THREE.PointLight(new THREE.Color(gl.color), 0, 900, 1.6);
    L.position.set(...gl.pos); scene.add(L); glows.push(L);
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({ color: new THREE.Color(gl.color), blending: THREE.AdditiveBlending, depthWrite: false, opacity: .75,
      map: (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'); const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = gr; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })() }));
    spr.position.copy(L.position); spr.scale.setScalar(/Beacon/.test(gl.name) ? 30 : 60); scene.add(spr);
  }

  // Blender drivers -> live animation (same expressions as the .blend files)
  const anim = [];
  for (const d of meta.drivers || []) {
    const o = world.getObjectByName(sanitize(d.name));
    if (!o) continue;
    let f; try { f = new Function('frame', 'with (Math) { return (' + d.expr.replace(/\*\*/g, '**') + '); }'); f(1); } catch (e) { continue; }
    anim.push({ o, f, path: d.path, i: d.index });
  }
  const apply = (a, v) => {
    if (a.path === 'location') { if (a.i === 2) a.o.position.y = v; else if (a.i === 0) a.o.position.x = v; else a.o.position.z = -v; }
    else if (a.path === 'rotation_euler') { if (a.i === 2) a.o.rotation.y = v; else if (a.i === 0) a.o.rotation.x = v; else a.o.rotation.z = -v; }
    else if (a.path === 'scale') { if (a.i === 2) a.o.scale.y = v; else if (a.i === 0) a.o.scale.x = v; else a.o.scale.z = v; }
  };

  // cameras: tour (hero -> flythrough -> aerial) + presets
  const paths = meta.paths || {};
  const curve = k => paths[k] && paths[k].points.length > 1 ? new THREE.CatmullRomCurve3(paths[k].points.map(p => new THREE.Vector3(...p))) : null;
  const segs = [['CAM_HeroReveal', 12], ['CAM_Flythrough', 39], ['CAM_Aerial', 9]].map(([k, s]) => ({ c: curve(k), s })).filter(x => x.c);
  const tourLen = segs.reduce((a, b) => a + b.s, 0);
  let mode = 'tour', tourT = 0;
  const btns = { tour: $('bTour'), hero: $('bHero'), aerial: $('bAerial'), free: $('bFree') };
  const setMode = m => {
    mode = m; Object.entries(btns).forEach(([k, b]) => b.classList.toggle('on', k === m));
    btns.tour.textContent = m === 'tour' ? '❚❚ Pause tour' : '▶ Cinematic tour';
    controls.enabled = m !== 'tour';
    if (m === 'hero' || m === 'aerial') {
      const c = curve(m === 'hero' ? 'CAM_HeroReveal' : 'CAM_Aerial');
      if (c) camera.position.copy(c.getPoint(m === 'hero' ? 0.6 : 0)); controls.target.copy(focus); setMode('free');
      btns[m].classList.add('on'); btns.free.classList.remove('on');
    }
    if (m === 'free') controls.target.copy(focus);
  };
  btns.tour.onclick = () => setMode(mode === 'tour' ? 'free' : 'tour');
  btns.hero.onclick = () => setMode('hero'); btns.aerial.onclick = () => setMode('aerial'); btns.free.onclick = () => setMode('free');
  addEventListener('keydown', e => { const k = e.key.toLowerCase(); if (k === 't') btns.tour.click(); if (k === 'h') setMode('hero'); if (k === 'a') setMode('aerial'); if (k === 'f') setMode('free'); });
  renderer.domElement.addEventListener('pointerdown', () => { if (mode === 'tour') setMode('free'); });
  if (segs.length) camera.position.copy(segs[0].c.getPoint(0)); else camera.position.set(focus.x + 600, focus.y + 250, focus.z + 600);
  camera.lookAt(focus); controls.target.copy(focus);
  setMode('tour');

  setProgress(1, 'Ready');
  setTimeout(() => { $('loading').style.opacity = 0; setTimeout(() => $('loading').remove(), 650); }, 250);
  if (innerWidth < 700) { $('info').classList.add('collapsed'); $('toggleLore').textContent = 'Show story'; }

  const clock = new THREE.Clock();
  const look = new THREE.Vector3();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
    uTime.value = t;
    const frame = 1 + (t * 24) % 1440;
    for (const a of anim) apply(a, a.f(frame));
    clouds.forEach((tx, i) => { tx.offset.x = t * 0.004 * (i + 1); tx.offset.y = t * 0.0015; });
    for (const m of motes) { const p = m.pts.geometry.attributes.position; for (let i = 0; i < m.ph.length; i++) { p.array[i * 3 + 1] = m.base[i * 3 + 1] + Math.sin(t * 0.6 + m.ph[i]) * 3; p.array[i * 3] = m.base[i * 3] + Math.cos(t * 0.4 + m.ph[i]) * 2; } p.needsUpdate = true; }
    glows.forEach((L, i) => L.intensity = 4000 * (0.8 + 0.2 * Math.sin(t * 1.2 + i)));
    if (mode === 'tour' && segs.length) {
      tourT = (tourT + dt) % tourLen;
      let acc = 0;
      for (const s of segs) { if (tourT < acc + s.s) { camera.position.copy(s.c.getPoint((tourT - acc) / s.s)); break; } acc += s.s; }
      look.copy(focus); camera.lookAt(look);
    } else controls.update();
    dome.position.copy(camera.position);
    renderer.render(scene, camera);
  });
}
main().catch(fail);
</script>
</body>
</html>
